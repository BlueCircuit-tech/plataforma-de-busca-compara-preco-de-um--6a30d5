<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
  <title>Kilegal</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,100..1000;1,9..40,100..1000&family=Syne:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: { display: ['Syne','sans-serif'], body: ['"DM Sans"','sans-serif'] },
          colors: {
            marca: {
              50:'#fdfaef',100:'#f9efcd',200:'#f3de9c',300:'#eccd6a',400:'#e5bc38',
              500:'#D4AF37',600:'#b8951f',700:'#8c7118',800:'#5f4d11',900:'#33290a'
            }
          },
          dark: { DEFAULT:'#0A0A0A', 50:'#171717',100:'#222222',200:'#2E2E2E',300:'#3A3A3A' },
          light: { DEFAULT:'#FAFAFA', 50:'#FFFFFF',100:'#F5F5F5',200:'#EEEEEE',300:'#E0E0E0' }
        }
      }
    }
  </script>
  <style>
    *, *::before, *::after { -webkit-tap-highlight-color: transparent; box-sizing: border-box; }
    html { height: 100%; }
    body { font-family: 'DM Sans', sans-serif; background: #0A0A0A; min-height: 100%; overscroll-behavior: none; }

    @keyframes kilegal-in {
      from { opacity:0; transform:translateY(14px); }
      to   { opacity:1; transform:translateY(0); }
    }
    [data-tela]:not(.hidden) { animation: kilegal-in .3s cubic-bezier(.4,0,.2,1) forwards; }

    ::-webkit-scrollbar { width: 0; height: 0; }

    *:focus-visible { outline: 2px solid #D4AF37; outline-offset: 2px; border-radius: 4px; }

    .ativo { color: #D4AF37 !important; }
    .ativo svg { fill: #D4AF37; }

    .card {
      background: #FFFFFF; border-radius: 14px; padding: 18px;
      box-shadow: 0 1px 3px rgba(0,0,0,.08), 0 4px 16px rgba(0,0,0,.04);
      transition: box-shadow .2s, transform .2s;
    }
    .card:active { transform: scale(.985); }

    .badge {
      display: inline-flex; align-items: center; gap: 4px;
      border-radius: 999px; padding: 2px 10px;
      font-size: .7rem; font-weight: 600; line-height: 1.6;
      font-family: 'DM Sans', sans-serif;
    }

    .btn {
      display: flex; align-items: center; justify-content: center; gap: 6px;
      font-family: 'DM Sans', sans-serif; font-weight: 600;
      border-radius: 12px; padding: 14px 24px; cursor: pointer;
      border: none; transition: all .2s; font-size: .95rem; width: 100%;
      -webkit-appearance: none;
    }
    .btn:active { transform: scale(.97); }
    .btn-primario { background: linear-gradient(135deg,#D4AF37,#b8951f); color: #0A0A0A; }
    .btn-primario:hover { box-shadow: 0 4px 20px rgba(212,175,55,.3); }
    .btn-secundario { background: transparent; color: #FAFAFA; border: 1.5px solid rgba(250,250,250,.2); }
    .btn-secundario:hover { border-color: rgba(212,175,55,.5); color: #D4AF37; }
    .btn-contorno { background: transparent; color: #0A0A0A; border: 1.5px solid #0A0A0A; }
    .btn-contorno:hover { background: #0A0A0A; color: #FAFAFA; }
    .btn-pequeno { padding: 8px 14px; font-size: .8rem; border-radius: 8px; }
    .btn-sm { padding: 6px 12px; font-size: .75rem; border-radius: 8px; }
    .btn:disabled { opacity:.5; cursor: not-allowed; }

    .nav-btn {
      background: none; border: none; cursor: pointer;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      gap: 2px; color: rgba(250,250,250,.3);
      font-size: .6rem; font-weight: 600; font-family: 'DM Sans', sans-serif;
      padding: 6px 0; min-width: 52px; flex: 1;
      transition: color .2s, transform .15s;
      -webkit-tap-highlight-color: transparent; position: relative;
    }
    .nav-btn:active { transform: scale(.9); }
    .nav-btn svg { transition: fill .2s, stroke .2s; }

    .input-k {
      width: 100%; padding: 13px 16px; background: #F5F5F5;
      border: 1.5px solid #EEEEEE; border-radius: 12px;
      font-family: 'DM Sans', sans-serif; font-size: .95rem;
      color: #0A0A0A; transition: border-color .2s, box-shadow .2s;
      -webkit-appearance: none;
    }
    .input-k::placeholder { color: #999; }
    .input-k:focus { outline: none; border-color: #D4AF37; box-shadow: 0 0 0 3px rgba(212,175,55,.12); }

    .input-dark {
      width: 100%; padding: 13px 16px; background: rgba(255,255,255,.06);
      border: 1.5px solid rgba(255,255,255,.08); border-radius: 12px;
      font-family: 'DM Sans', sans-serif; font-size: .95rem;
      color: #FAFAFA; transition: border-color .2s, box-shadow .2s;
    }
    .input-dark::placeholder { color: rgba(250,250,250,.3); }
    .input-dark:focus { outline: none; border-color: rgba(212,175,55,.5); box-shadow: 0 0 0 3px rgba(212,175,55,.08); }

    .label-k {
      display: block; font-size: .72rem; font-weight: 700;
      color: rgba(250,250,250,.45); margin-bottom: 6px;
      text-transform: uppercase; letter-spacing: .04em;
    }

    .label-k-dark {
      display: block; font-size: .72rem; font-weight: 700;
      color: rgba(0,0,0,.4); margin-bottom: 6px;
      text-transform: uppercase; letter-spacing: .04em;
    }

    @keyframes pulse-dot {
      0%,100% { opacity:1; transform: scale(1); }
      50%      { opacity:.4; transform: scale(.75); }
    }
    .pulse-dot { animation: pulse-dot 1.8s ease-in-out infinite; }
    .pulse-dot-2 { animation: pulse-dot 1.8s ease-in-out .3s infinite; }
    .pulse-dot-3 { animation: pulse-dot 1.8s ease-in-out .6s infinite; }

    @keyframes skeleton { 0% { background-position: -200px 0; } 100% { background-position: calc(200px + 100%) 0; } }
    .skeleton {
      background: linear-gradient(90deg,#f0f0f0 25%,#e8e8e8 50%,#f0f0f0 75%);
      background-size: 200px 100%; border-radius: 8px;
      animation: skeleton 1.5s ease-in-out infinite;
    }

    .seg { cursor: pointer; border-radius: 12px; padding: 12px; border: 1.5px solid transparent; transition: all .2s; }
    .seg:hover { border-color: rgba(212,175,55,.25); background: rgba(212,175,55,.04); }

    @keyframes toast-in  { from { opacity:0; transform:translateY(20px) scale(.95); } to { opacity:1; transform:translateY(0) scale(1); } }
    @keyframes toast-out { from { opacity:1; transform:translateY(0) scale(1); } to { opacity:0; transform:translateY(-10px) scale(.95); } }
    .toast-enter { animation: toast-in .3s ease-out; }
    .toast-exit  { animation: toast-out .3s ease-in forwards; }

    .chip {
      display: inline-flex; align-items: center; gap: 4px;
      border-radius: 999px; padding: 6px 14px;
      font-size: .78rem; font-weight: 500; cursor: pointer;
      border: 1.5px solid #E0E0E0; background: #FFF;
      color: #0A0A0A; transition: all .15s;
      font-family: 'DM Sans', sans-serif;
    }
    .chip:hover, .chip-ativo { border-color: #D4AF37; background: #fdfaef; color: #0A0A0A; }

    .tgl { position:relative; width:46px; height:26px; cursor:pointer; flex-shrink:0; }
    .tgl input { display:none; }
    .tgl-slider {
      position:absolute; inset:0; background:#ccc; border-radius:999px;
      transition: background .2s;
    }
    .tgl-slider::before {
      content:''; position:absolute; top:3px; left:3px;
      width:20px; height:20px; border-radius:50%; background:#FFF;
      transition: transform .2s; box-shadow: 0 1px 3px rgba(0,0,0,.2);
    }
    .tgl input:checked + .tgl-slider { background: #D4AF37; }
    .tgl input:checked + .tgl-slider::before { transform: translateX(20px); }

    .avatar {
      width: 40px; height: 40px; border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      font-family: 'Syne', sans-serif; font-weight: 700; font-size: .9rem;
      flex-shrink: 0; color: #FFF;
    }
  </style>
</head>
<body>

  <!-- ======= APP WRAPPER ======= -->
  <div id="app" class="mx-auto" style="height:100dvh;max-width:390px;display:flex;flex-direction:column;background:#0A0A0A;position:relative;overflow:hidden;">

    <!-- ======= STATUS BAR ======= -->
    <div class="shrink-0 flex items-end justify-between px-7 pb-1.5 select-none" style="background:#0A0A0A;padding-top:max(env(safe-area-inset-top),6px);min-height:38px;">
      <span class="text-white font-body text-sm font-semibold" id="status-hora">09:41</span>
      <div class="flex items-center gap-1.5 text-white">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><path d="M1 9l2 2c4.97-4.97 13.03-4.97 18 0l2-2C16.93 2.93 7.08 2.93 1 9zm8 8l3 3 3-3c-1.65-1.66-4.34-1.66-6 0zm-2-4l2 2c2.76-2.76 7.24-2.76 10 0l2-2C15.14 9.14 8.87 9.14 7 13z"/></svg>
        <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><path d="M15.67 4H14V2h-4v2H8.33C7.6 4 7 4.6 7 5.33v15.33C7 21.4 7.6 22 8.33 22h7.33c.74 0 1.34-.6 1.34-1.33V5.33C17 4.6 16.4 4 15.67 4z"/></svg>
      </div>
    </div>

    <!-- ======= APP HEADER ======= -->
    <header id="app-header" class="shrink-0 flex items-center justify-between px-5 select-none" style="background:#0A0A0A;padding:6px 20px 10px;z-index:10;">
      <div class="flex items-center gap-2.5">
        <svg width="32" height="32" viewBox="0 0 40 40" fill="none">
          <rect width="40" height="40" rx="10" fill="#D4AF37"/>
          <path d="M11 26L18 14M25 14L18 26" stroke="#0A0A0A" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
          <path d="M18 14V26" stroke="#0A0A0A" stroke-width="2.5" stroke-linecap="round" opacity=".3"/>
          <circle cx="18" cy="20" r="2" fill="#0A0A0A" opacity=".35"/>
        </svg>
        <span class="font-display text-white font-bold text-lg tracking-tight">Kilegal</span>
      </div>
      <button class="relative p-2 rounded-full" style="background:rgba(255,255,255,.06);" onclick="toast('Sem notificações no momento','info')" aria-label="Notificações">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="rgba(250,250,250,.8)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9"/><path d="M10.3 21a1.94 1.94 0 0 0 3.4 0"/></svg>
        <span class="absolute top-1.5 right-1.5 w-2 h-2 bg-marca-500 rounded-full"></span>
      </button>
    </header>

    <!-- ======= SCREEN AREA ======= -->
    <main id="tela-scroll" class="flex-1 overflow-y-auto" style="background:#0A0A0A;">
      <section data-tela="inicio-e-busca" class="hidden">
      <div class="h-full flex flex-col">
        <!-- Topo com barra de pesquisa -->
        <div class="flex items-center gap-3 px-4 pt-3 pb-2 bg-marca-900 shrink-0">
          <button onclick="inicio_e_busca_focarBusca()" class="flex-1 flex items-center gap-2 bg-marca-800 text-marca-200 rounded-xl px-4 py-3 text-left hover:bg-marca-700 transition-colors active:scale-95">
            <svg class="w-5 h-5 text-marca-400 shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/></svg>
            <span class="text-sm text-marca-400 truncate">Para onde você quer ir?</span>
          </button>
          <button onclick="inicio_e_busca_voz()" class="w-10 h-10 flex items-center justify-center bg-marca-800 rounded-xl hover:bg-marca-700 transition-colors active:scale-95">
            <svg class="w-5 h-5 text-marca-200" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 11a7 7 0 01-7 7m0 0a7 7 0 01-7-7m7 7v4m0 0H8m4 0h4m-4-8a3 3 0 01-3-3V5a3 3 0 116 0v6a3 3 0 01-3 3z"/></svg>
          </button>
        </div>

        <!-- Mapa simulado -->
        <div id="mapaContainer" class="relative flex-1 min-h-0 bg-marca-900 overflow-hidden cursor-grab active:cursor-grabbing" onclick="inicio_e_busca_interagirMapa(event)">
          <svg class="w-full h-full" viewBox="0 0 375 400" preserveAspectRatio="xMidYMid slice">
            <defs>
              <pattern id="ruas" width="40" height="40" patternUnits="userSpaceOnUse">
                <rect width="40" height="40" fill="#111111"/>
                <rect x="0" y="16" width="40" height="8" fill="#1a1a1a"/>
                <rect x="16" y="0" width="8" height="40" fill="#1a1a1a"/>
              </pattern>
              <radialGradient id="pinoGrad" cx="50%" cy="30%" r="60%">
                <stop offset="0%" stop-color="#D4AF37" stop-opacity="0.9"/>
                <stop offset="100%" stop-color="#0A0A0A" stop-opacity="0.6"/>
              </radialGradient>
              <filter id="sombraMarcador"><feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#000000" flood-opacity="0.4"/></filter>
            </defs>
            <rect width="375" height="400" fill="url(#ruas)"/>
            <circle cx="140" cy="180" r="30" fill="#1a1a1a" opacity="0.5"/>
            <circle cx="250" cy="280" r="45" fill="#1a1a1a" opacity="0.5"/>
            <circle cx="100" cy="320" r="25" fill="#1a1a1a" opacity="0.5"/>
            <circle cx="300" cy="120" r="35" fill="#1a1a1a" opacity="0.5"/>

            <!-- Marcador central do usuário -->
            <g filter="url(#sombraMarcador)">
              <circle cx="187" cy="200" r="14" fill="url(#pinoGrad)"/>
              <circle cx="187" cy="200" r="6" fill="#FAFAFA"/>
            </g>

            <!-- Marcadores de veículos animados -->
            <g class="marcador-veiculo" data-veiculo="1">
              <rect x="90" y="120" width="28" height="18" rx="5" fill="#D4AF37" opacity="0.85"/>
              <circle cx="96" cy="138" r="3" fill="#0A0A0A" opacity="0.5"/>
              <circle cx="112" cy="138" r="3" fill="#0A0A0A" opacity="0.5"/>
            </g>
            <g class="marcador-veiculo" data-veiculo="2">
              <rect x="280" y="220" width="28" height="18" rx="5" fill="#D4AF37" opacity="0.85"/>
              <circle cx="286" cy="238" r="3" fill="#0A0A0A" opacity="0.5"/>
              <circle cx="302" cy="238" r="3" fill="#0A0A0A" opacity="0.5"/>
            </g>
            <g class="marcador-veiculo" data-veiculo="3">
              <rect x="60" y="260" width="28" height="18" rx="5" fill="#D4AF37" opacity="0.85"/>
              <circle cx="66" cy="278" r="3" fill="#0A0A0A" opacity="0.5"/>
              <circle cx="82" cy="278" r="3" fill="#0A0A0A" opacity="0.5"/>
            </g>
            <g class="marcador-veiculo" data-veiculo="4">
              <rect x="310" y="80" width="28" height="18" rx="5" fill="#D4AF37" opacity="0.85"/>
              <circle cx="316" cy="98" r="3" fill="#0A0A0A" opacity="0.5"/>
              <circle cx="332" cy="98" r="3" fill="#0A0A0A" opacity="0.5"/>
            </g>
            <g class="marcador-veiculo" data-veiculo="5">
              <rect x="220" y="150" width="28" height="18" rx="5" fill="#D4AF37" opacity="0.85"/>
              <circle cx="226" cy="168" r="3" fill="#0A0A0A" opacity="0.5"/>
              <circle cx="242" cy="168" r="3" fill="#0A0A0A" opacity="0.5"/>
            </g>

            <!-- Ruas principais -->
            <line x1="0" y1="160" x2="375" y2="140" stroke="#222222" stroke-width="6"/>
            <line x1="0" y1="260" x2="375" y2="280" stroke="#222222" stroke-width="5"/>
            <line x1="130" y1="0" x2="120" y2="400" stroke="#222222" stroke-width="5"/>
            <line x1="260" y1="0" x2="270" y2="400" stroke="#222222" stroke-width="4"/>
          </svg>
          <div class="absolute top-3 left-3 flex items-center gap-1.5 bg-marca-900/80 backdrop-blur-sm text-marca-200 text-xs px-2.5 py-1.5 rounded-lg">
            <span class="w-2 h-2 bg-green-400 rounded-full animate-pulse"></span>
            <span>5 veículos próximos</span>
          </div>
        </div>

        <!-- Área de conteúdo abaixo do mapa -->
        <div class="bg-marca-50 rounded-t-2xl -mt-4 relative z-10 shrink-0 flex flex-col" style="height: 180px;">
          <!-- Categorias -->
          <div class="flex gap-2 px-4 pt-4 pb-2 overflow-x-auto scrollbar-hide" style="scrollbar-width: none;">
            <button onclick="inicio_e_busca_categoria('carro')" class="categoria-btn flex items-center gap-2 bg-marca-900 text-white pl-3 pr-4 py-2.5 rounded-xl shrink-0 text-sm font-medium hover:bg-marca-800 transition-all active:scale-95 border-2 border-transparent" data-cat="carro">
              <div class="w-8 h-8 rounded-lg bg-marca-50/10 flex items-center justify-center"><svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 7h8m-8 4h8m-4 4v2m-6-2h12a2 2 0 002-2V7a2 2 0 00-2-2H6a2 2 0 00-2 2v8a2 2 0 002 2z"/></svg></div>
              Carro
            </button>
            <button onclick="inicio_e_busca_categoria('motoboy')" class="categoria-btn flex items-center gap-2 bg-white text-marca-800 pl-3 pr-4 py-2.5 rounded-xl shrink-0 text-sm font-medium hover:bg-gray-50 transition-all active:scale-95 border-2 border-transparent shadow-sm" data-cat="motoboy">
              <div class="w-8 h-8 rounded-lg bg-marca-50 flex items-center justify-center text-marca-600"><svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 10V3L4 14h7v7l9-11h-7z"/></svg></div>
              MotoBoy
            </button>
            <button onclick="inicio_e_busca_categoria('guincho')" class="categoria-btn flex items-center gap-2 bg-white text-marca-800 pl-3 pr-4 py-2.5 rounded-xl shrink-0 text-sm font-medium hover:bg-gray-50 transition-all active:scale-95 border-2 border-transparent shadow-sm" data-cat="guincho">
              <div class="w-8 h-8 rounded-lg bg-marca-50 flex items-center justify-center text-marca-600"><svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 17a2 2 0 11-4 0 2 2 0 014 0zM19 17a2 2 0 11-4 0 2 2 0 014 0z"/><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 16V6a1 1 0 00-1-1H4a1 1 0 00-1 1v10a1 1 0 001 1h1m8-1a1 1 0 01-1 1H9m4-1V8a1 1 0 011-1h2.586a1 1 0 01.707.293l3.414 3.414a1 1 0 01.293.707V16a1 1 0 01-1 1h-1m-6-1a1 1 0 001 1h1M5 17a2 2 0 104 0m-4 0a2 2 0 114 0"/></svg></div>
              Guincho
            </button>
            <button onclick="inicio_e_busca_categoria('telegas')" class="categoria-btn flex items-center gap-2 bg-white text-marca-800 pl-3 pr-4 py-2.5 rounded-xl shrink-0 text-sm font-medium hover:bg-gray-50 transition-all active:scale-95 border-2 border-transparent shadow-sm" data-cat="telegas">
              <div class="w-8 h-8 rounded-lg bg-marca-50 flex items-center justify-center text-marca-600"><svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17.657 18.657A8 8 0 016.343 7.343S7 9 9 10c0-2 .5-5 2.986-7C14 5 16.09 5.777 17.656 7.343A7.975 7.975 0 0120 13a7.975 7.975 0 01-2.343 5.657z"/><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9.879 7.048A4 4 0 015.657 3.343S7 5 9 6.343c0 .828.448 1.562 1.118 1.986"/></svg></div>
              TeleGás
            </button>
            <button onclick="inicio_e_busca_categoria('excursao')" class="categoria-btn flex items-center gap-2 bg-white text-marca-800 pl-3 pr-4 py-2.5 rounded-xl shrink-0 text-sm font-medium hover:bg-gray-50 transition-all active:scale-95 border-2 border-transparent shadow-sm" data-cat="excursao">
              <div class="w-8 h-8 rounded-lg bg-marca-50 flex items-center justify-center text-marca-600"><svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3.055 11H5a2 2 0 012 2v1a2 2 0 002 2 2 2 0 012 2v2.945M8 3.935V5.5A2.5 2.5 0 0010.5 8h.5a2 2 0 012 2 2 2 0 104 0 2 2 0 012-2h1.064M15 20.488V18a2 2 0 012-2h3.064M21 12a9 9 0 11-18 0 9 9 0 0118 0z"/></svg></div>
              Excursões
            </button>
          </div>

          <!-- Banner promocional -->
          <div class="px-4 pb-2">
            <button onclick="inicio_e_busca_bannerPromo()" class="w-full bg-marca-600 text-marca-900 rounded-xl p-3.5 flex items-center gap-3 active:scale-[0.98] transition-transform relative overflow-hidden">
              <div class="absolute top-0 right-0 w-24 h-24 bg-marca-500/30 rounded-full -translate-y-1/2 translate-x-1/4"></div>
              <div class="w-10 h-10 bg-marca-900 rounded-xl flex items-center justify-center shrink-0">

          function inicio_e_busca_focarBusca(){
            const overlay = document.getElementById('overlayBusca');

            overlay.classList.remove('hidden');
            requestAnimationFrame(() => { content.style.transform = 'translateY(0)'; });
            setTimeout(() => { document.getElementById('inputBusca').focus(); }, 350);
          }

          function inicio_e_busca_fecharOverlay(event){
            if (event && event.target !== event.currentTarget) return;
            const content = document.getElementById('overlayBuscaContent');
            content.style.transform = 'translateY(100%)';
            setTimeout(() => {
              document.getElementById('overlayBusca').classList.add('hidden');
              document.getElementById('inputBusca').value = '';
            }, 300);
          }

          function inicio_e_busca_filtrarSugestoes(termo){
            const lista = document.getElementById('listaSugestoes');
            const termoLower = termo.toLowerCase().trim();
            let recentes = sugestoes.filter(s => s.tipo === 'recente' && (s.nome.toLowerCase().includes(termoLower) || s.bairro.toLowerCase().includes(termoLower)));
            let pois = sugestoes.filter(s => s.tipo === 'poi' && (s.nome.toLowerCase().includes(termoLower) || s.bairro.toLowerCase().includes(termoLower)));
            if (termoLower) { recentes = [...recentes, ...pois]; pois = []; }
            let html = '';
            if (recentes.length > 0) {
              html += '<p class="text-xs font-bold text-marca-400 uppercase tracking-wider mb-2">' + (termoLower ? 'Resultados' : 'Recentes') + '</p>';
              recentes.forEach(s => {
                const iconeTipo = s.tipo === 'poi' ? { saude: 'text-red-400 bg-red-50', transporte: 'text-blue-400 bg-blue-50', esportes: 'text-green-500 bg-green-50', parque: 'text-green-500 bg-green-50' }[s.bairro] || 'text-marca-400 bg-marca-900/5';
                html += '<button onclick=\'inicio_e_busca_selecionarEndereco("' + s.nome + ', ' + s.bairro + '")\' class="w-full flex items-center gap-3 p-3 rounded-xl hover:bg-marca-900/5 transition-colors text-left">';
                html += '<div class="w-8 h-8 rounded-lg flex items-center justify-center shrink-0 ' + (s.tipo === 'poi' ? iconeTipo : 'bg-marca-900/5') + '">';
                html += '<svg class="w-4 h-4 ' + (s.tipo === 'poi' ? '' : 'text-marca-400') + '" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z"/></svg></div>';
                html += '<div><p class="text-sm font-medium text-marca-900">' + s.nome + '</p><p class="text-xs text-marca-400">' + s.bairro + '</p></div></button>';
              });
            }
            if (pois.length > 0 && !termoLower) {
              html += '<p class="text-xs font-bold text-marca-400 uppercase tracking-wider mb-2 mt-3">Pontos de interesse</p>';
              pois.forEach(s => {
                html += '<button onclick=\'inicio_e_busca_selecionarEndereco("' + s.nome + ')\' class="w-full flex items-center gap-3 p-3 rounded-xl hover:bg-marca-900/5 transition-colors text-left">';
                html += '<div class="w-8 h-8 rounded-lg bg-marca-900/5 flex items-center justify-center shrink-0"><svg class="w-4 h-4 text-marca-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17.657 16.657L13.414 20.9a1.998 1.998 0 01-2.827 0l-4.244-4.243A8 8 0 1117.657 16.657z"/><circle cx="12" cy="11" r="1.5" fill="currentColor"/></svg></div>';
                html += '<div><p class="text-sm font-medium text-marca-900">' + s.nome + '</p><p class="text-xs text-marca-400">' + s.bairro + '</p></div></button>';
              });
            }
            if (!html) {
              html = '<div class="text-center py-8"><svg class="w-12 h-12 text-marca-300 mx-auto mb-2" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/></svg><p class="text-sm text-marca-400">Nenhum resultado encontrado</p></div>';
            }
            lista.innerHTML = html;
          }

          function inicio_e_busca_selecionarEndereco(endereco){
            inicio_e_busca_fecharOverlay();
            document.getElementById('overlayBusca').classList.add('hidden');
            toast('Destino: ' + endereco, 'info');
            setTimeout(() => { mostrarTela('busca-e-filtros'); }, 500);
          }

          function inicio_e_busca_categoria(cat){
            document.querySelectorAll('.categoria-btn').forEach(btn => {
              btn.classList.remove('bg-marca-900', 'text-white', 'border-marca-400');
              btn.classList.add('bg-white', 'text-marca-800');
            });
            const ativo = document.querySelector('[data-cat="' + cat + '"]');
            ativo.classList.remove('bg-white', 'text-marca-800');
            ativo.classList.add('bg-marca-900', 'text-white', 'border-marca-400');
            toast('Categoria: ' + cat.charAt(0).toUpperCase() + cat.slice(1), 'info');
            setTimeout(() => {
              if (cat === 'motoboy') mostrarTela('solicitar-motoboy');
              else mostrarTela('busca-e-filtros');
            }, 400);
          }

          function inicio_e_busca_bannerPromo(){
            mostrarTela('busca-e-filtros');
          }

          function inicio_e_busca_voz(){
            toast('Reconhecimento de voz ativado', 'info');
            setTimeout(() => { mostrarTela('busca-e-filtros'); }, 800);
          }

          function inicio_e_busca_interagirMapa(e){
            if (e.target.closest('#mapaContainer')) {
              toast('Toque para definir ponto de partida', 'info');
            }
          }

          // Animação suave dos marcadores
          let frame = 0;
          function animarMarcadores(){
            const markers = document.querySelectorAll('.marcador-veiculo');
            markers.forEach((m, i) => {
              const offset = Math.sin(frame * 0.02 + i * 1.2) * 3;
              m.setAttribute('transform', 'translate(0,' + offset + ')');
            });
            frame++;
            requestAnimationFrame(animarMarcadores);
          }
          animarMarcadores();

          // Navegação inferior
          window._navegarInicio = function(tela){
            mostrarTela(tela);
          };
        })();

  <script>
    var toastTimer = null;
    function toast(mensagem, tipo) {
      var area = document.getElementById('toast-area');
      var cores = { ok:{bg:'#f0fdf4',bd:'#22c55e',tx:'#15803d',ic:'✓'}, erro:{bg:'#fef2f2',bd:'#ef4444',tx:'#b91c1c',ic:'✕'}, info:{bg:'#fdfaef',bd:'#D4AF37',tx:'#8c7118',ic:'◆'} };
      var c = cores[tipo] || cores.info;
      var el = document.createElement('div');
      el.className = 'toast-enter';
      el.style.cssText = 'pointer-events:auto;background:'+c.bg+';border:1.5px solid '+c.bd+';border-radius:12px;padding:12px 16px;display:flex;align-items:center;gap:10px;font-family:"DM Sans",sans-serif;font-size:.875rem;color:'+c.tx+';font-weight:500;box-shadow:0 8px 24px rgba(0,0,0,.12);';
      el.innerHTML = '<span style="width:20px;height:20px;border-radius:50%;background:'+c.bd+';color:#FFF;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;flex-shrink:0;">'+c.ic+'</span><span style="flex:1;">'+mensagem+'</span>';
      area.appendChild(el);
      clearTimeout(toastTimer);
      toastTimer = setTimeout(function() {
        el.className = 'toast-exit';
        setTimeout(function() { el.remove(); }, 300);
      }, 3000);
    }

    function abrirModal(html, titulo) {
      document.getElementById('modal-titulo').textContent = titulo || '';
      document.getElementById('modal-conteudo').innerHTML = html;
      document.getElementById('modal').classList.remove('hidden');
      document.body.style.overflow = 'hidden';
    }
    function fecharModal() {
      document.getElementById('modal').classList.add('hidden');
      document.body.style.overflow = '';
    }
    document.addEventListener('keydown', function(e) { if (e.key === 'Escape') fecharModal(); });

    function brl(v) { return 'R$ ' + Number(v).toLocaleString('pt-BR',{minimumFractionDigits:2,maximumFractionDigits:2}); }
    function dataBR(iso) {
      var d = new Date(iso+'T12:00:00');
      return String(d.getDate()).padStart(2,'0')+'/'+String(d.getMonth()+1).padStart(2,'0')+'/'+d.getFullYear();
    }
  </script>
</body>
